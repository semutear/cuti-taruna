name: Build & Release APK Android

on:
  push:
    tags:
      - 'v*'          # Trigger otomatis setiap kali ada tag seperti v1.2, v1.3, dst.

jobs:
  build:
    name: Build & Upload APK
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Diperlukan untuk membuat GitHub Release

    steps:
      # 1. Checkout kode sumber
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17 (diperlukan untuk Gradle Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cache Gradle dependencies agar build berikutnya lebih cepat
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Beri izin eksekusi pada gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x mobile-app/gradlew

      # 6. Build APK Debug
      - name: Build Debug APK
        run: |
          cd mobile-app
          ./gradlew assembleDebug --no-daemon

      # 7. Rename APK dengan versi tag yang aktif (misal: cuti-taruna-v1.2.apk)
      - name: Rename APK
        run: |
          TAG=${{ github.ref_name }}
          cp mobile-app/app/build/outputs/apk/debug/app-debug.apk cuti-taruna-${TAG}.apk
          echo "APK_NAME=cuti-taruna-${TAG}.apk" >> $GITHUB_ENV

      # 8. Buat GitHub Release dan upload APK secara otomatis
      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "Cuti Taruna ${{ github.ref_name }}"
          body: |
            ## 📱 Cuti Taruna Mobile App ${{ github.ref_name }}

            ### Cara Instal:
            1. Download file APK di bawah ini (`cuti-taruna-${{ github.ref_name }}.apk`)
            2. Buka file APK di HP Android Anda
            3. Jika muncul peringatan, aktifkan **"Instal dari sumber tidak dikenal"** di Pengaturan
            4. Ikuti langkah instalasi hingga selesai

            ### Catatan:
            - Minimum Android versi 10 (API 29)
            - Pastikan HP terhubung ke internet agar bisa terhubung ke API server
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
